name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: test "$(jq -r '.version' package.json)" = "$(cat VERSION)"
      - name: Test Swift core
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build and verify native app
        run: ./tools/build-app.sh
      - name: Verify control protocol and expiry
        run: python3 tools/verify-native.py dist/Caffeinator.app/Contents/MacOS/caffeinator
      - uses: oven-sh/setup-bun@v2
      - name: Install Raycast dependencies
        working-directory: extensions/raycast
        run: bun install --frozen-lockfile
      - name: Verify Raycast extension
        working-directory: extensions/raycast
        run: |
          bun run typecheck
          bun test tests
          bun run build
