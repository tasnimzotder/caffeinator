name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon release
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
      dmg_name: ${{ steps.dmg.outputs.dmg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$version"
          test "$(jq -r '.version' package.json)" = "$version"

      - name: Test Swift core
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build, sign, and verify DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-dmg.sh
          python3 tools/verify-native.py dist/Caffeinator.app/Contents/MacOS/caffeinator
          dmg_name="Caffeinator_${GITHUB_REF_NAME}_aarch64.dmg"
          sha256="$(shasum -a 256 "dist/$dmg_name" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [build, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN"
          version_num="${VERSION#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tasnimzotder/homebrew-tap.git" homebrew-tap
          sed -e "s/{{VERSION_NUM}}/${version_num}/g" \
              -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA256}}/${SHA256}/g" \
              .github/homebrew/caffeinator.rb.template > homebrew-tap/Casks/caffeinator.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/caffeinator.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update caffeinator to ${VERSION}"
          git push
