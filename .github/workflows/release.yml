name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Apple Silicon release
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
      dmg_name: ${{ steps.dmg.outputs.dmg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r '.version' package.json)" = "$version"
          test "$(jq -r '.version' src-tauri/tauri.conf.json)" = "$version"
          test "$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"

      - name: Check and test
        run: |
          bun run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Build application
        run: bun run tauri build --target aarch64-apple-darwin --bundles app

      - name: Sign and verify bundle
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Caffeinator.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Create DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg_name="Caffeinator_${GITHUB_REF_NAME}_aarch64.dmg"
          hdiutil create -volname Caffeinator -srcfolder "$bundle_dir/macos/Caffeinator.app" -ov -format UDZO "$bundle_dir/$dmg_name"
          sha256="$(shasum -a 256 "$bundle_dir/$dmg_name" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [build, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN"
          version_num="${VERSION#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tasnimzotder/homebrew-tap.git" homebrew-tap
          sed -e "s/{{VERSION_NUM}}/${version_num}/g" \
              -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA256}}/${SHA256}/g" \
              .github/homebrew/caffeinator.rb.template > homebrew-tap/Casks/caffeinator.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/caffeinator.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update caffeinator to ${VERSION}"
          git push
